# 发版流水线:推送 v* tag 触发。
# GoReleaser 跨平台构建 → GitHub Release(二进制 + 校验和 + changelog)+ ghcr.io 多架构镜像。
# 与 ci.yml(每次 push/PR 跑测试)正交;此处只在打 tag 时跑。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 GitHub Release、上传产物
  packages: write # 推送镜像到 ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # GoReleaser 需要完整历史与 tag 生成 changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # 多架构镜像构建所需:QEMU(跨架构模拟)+ buildx。
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 登录 ghcr.io,用 workflow 自带 GITHUB_TOKEN,无需额外配置密钥。
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仓库自适应注入:镜像命名空间(ghcr.io/<owner>/pipewright)与升级渠道(二进制内嵌的
      # 默认发布仓库)。tag 推到哪个仓库,Release/镜像/自升级渠道就都跟着那个仓库 —— fork
      # 无需改任何配置即可自行发版。goreleaser 模板经 {{ .Env.* }} 读取。
      # 注:docker 镜像引用要求全小写,owner 含大写(如 MyLinkPi)须经 bash 小写展开 ${VAR,,}。
      - name: Export release repo env
        run: |
          echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "RELEASE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 同一 commit 挂多个 tag 时(如正式重复测试同一个提交),CI 里 git describe 自动
          # 检 tag 会选错(实测 v2.0.0 与 v2.0.0-beta.7 同 commit 时选中 beta,产物 422
          # already_exists)。显式指定事件 ref 为当前 tag,goreleaser 会直接采用。
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  # Windows 安装包(NSIS)。goreleaser 的 nsis 打包是 Pro 专属,OSS 版不可用,故单列
  # 一个作业:release 作业发布后,下载刚产出的 pwclient_<ver>_windows_<arch>.zip,用原生
  # makensis 编译 build/windows/pwclient.nsi 成安装器,回传到同一个 Release。
  # 安装包替代「界面点安装服务」:装前先 net stop + 兜底 taskkill 解锁 exe/bin,覆盖后再
  # service install(开机自启 + 立即启动),完成页勾选即拉起托盘 —— 规避旧的「装完得手动
  # 进 Program Files 运行才连上」的时序坑。
  windows-installer:
    name: Windows installer (NSIS)
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: "${{ github.ref_name }}"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # goreleaser 归档名用去 v 的版本号;安装器文件名与 zip 对齐同样去 v。
      - name: Normalize version
        run: echo "VER=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis

      # release 作业刚发布的 pwclient 归档 zip(含 pwclient.exe + bin/ + licenses/ + LICENSE)。
      - name: Download client archives
        run: gh release download "$VERSION" -p "pwclient_${VER}_windows_*.zip" -D ./dl

      - name: Build installers
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            zip="./dl/pwclient_${VER}_windows_${arch}.zip"
            [ -f "$zip" ] || { echo "缺少 $zip,跳过"; continue; }
            bash scripts/build-installer.sh --zip "$zip" --version "$VER" --arch "$arch" --out ./installer
          done

      - name: Compute installer checksums
        run: |
          set -euo pipefail
          if ls installer/*_installer.exe >/dev/null 2>&1; then
            ( cd installer && sha256sum ./*_installer.exe > installer-checksums.txt )
          fi

      - name: Upload installers to release
        run: |
          set -euo pipefail
          ls -la installer
          gh release upload "$VERSION" installer/*_installer.exe --clobber
          [ -f installer/installer-checksums.txt ] && gh release upload "$VERSION" installer/installer-checksums.txt --clobber || true
