# Pipewright 自身仓库的 CI(GitHub Actions)。与产品面向用户的首发平台 Gitee(FR-1)无关。
# 用内置 gofmt + go vet(项目 config-protection 钩子禁止提交 lint 配置文件,故不引入 golangci)。
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
      # go:embed 需要 web/dist 与 uiserver/dist 存在;backend job 用占位即可(真实产物在
      # frontend job 验证)
      - name: ensure embed placeholders
        run: |
          mkdir -p web/dist
          [ -f web/dist/index.html ] || echo '<!doctype html><div id="app"></div>' > web/dist/index.html
          mkdir -p internal/pwclient/uiserver/dist
          [ -f internal/pwclient/uiserver/dist/index.html ] || echo '<!doctype html><div id="app"></div>' > internal/pwclient/uiserver/dist/index.html
      - name: gofmt check
        run: |
          out="$(gofmt -l cmd internal embed.go)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet . ./cmd/... ./internal/...
      - run: go test . ./cmd/... ./internal/...
      - name: static build
        run: CGO_ENABLED=0 go build -o pipewright ./cmd/pipewright
      # 发版目标全平台交叉编译:平台专属文件缺口(如某函数缺 darwin 实现)在
      # linux CI 的 vet/test 里不可见,只在 goreleaser 发版时爆炸,这里提前拦下。
      - name: cross-compile release targets
        run: |
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              echo "== pipewright $goos/$goarch"
              CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -o /dev/null ./cmd/pipewright
              echo "== pwclient $goos/$goarch"
              CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -o /dev/null ./cmd/pwclient
            done
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: cd web && npm ci
      - run: cd web && npm run build
      # 客户端前端(webclient/):lint + 类型检查 + 单测 + 构建
      - run: cd webclient && npm ci
      - run: cd webclient && npm run lint
      - run: cd webclient && npm run typecheck
      - run: cd webclient && npm run test
      - run: cd webclient && npm run build

  client-e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: cd webclient && npm ci
      - run: cd webclient && npm run build
      - run: cd webclient && npx playwright install --with-deps chromium
      - name: build linux client
        run: CGO_ENABLED=0 go build -o pwclient ./cmd/pwclient
      - name: playwright e2e
        run: bash scripts/client-e2e.sh

  mem-budget:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: cd web && npm ci && npm run build
      - name: resident memory <= 100MB
        run: bash scripts/mem-check.sh
