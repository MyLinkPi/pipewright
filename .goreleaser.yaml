# GoReleaser 发版配置:推 v* tag → 跨平台静态二进制 + 校验和 + changelog → GitHub Release;
# 同时构建 linux amd64/arm64 镜像并合并为多架构清单推 ghcr.io。
# 仓库自适应:Release 目标由 git remote 推断(tag 推到哪个仓库就发到哪);镜像命名空间与
# 升级渠道经 env 注入 —— CI(release.yml)始终导出 IMAGE_NAMESPACE/RELEASE_REPO,本地干跑
# 需先 export(如 RELEASE_REPO=<owner>/pipewright IMAGE_NAMESPACE=<owner>)。
# 本地干跑(含真建 docker,需本机 docker daemon):goreleaser release --snapshot --clean --skip=publish
# 仅二进制/不建镜像:再加 --skip=docker;校验配置:goreleaser check
version: 2

project_name: pipewright

before:
  hooks:
    - go mod download
    # 取 EasyTier 官方二进制到 third_party/,随 pwclient 归档分发(开箱即用,免首连下载;
    # 本地干跑网络受限时可 export PIPEWRIGHT_RELEASE_MIRROR=<镜像前缀>)。
    - bash scripts/fetch-easytier.sh
    # 前端先构建,供 go:embed(web/dist)。各架构二进制共享同一份与平台无关的前端产物。
    - bash -c "cd web && npm ci && npm run build"
    # 客户端前端(webclient/ → internal/pwclient/uiserver/dist),随 pwclient 二进制嵌入。
    - bash -c "cd webclient && npm ci && npm run build"

builds:
  - id: pipewright
    main: ./cmd/pipewright
    binary: pipewright
    env:
      - CGO_ENABLED=0 # modernc sqlite + go-sql-driver/mysql 均纯 Go,可纯静态交叉编译
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}" # 可复现构建
    ldflags:
      - -s -w
      - -X github.com/huangchengsir/pipewright/internal/version.Version={{ .Version }}
      - -X github.com/huangchengsir/pipewright/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/huangchengsir/pipewright/internal/version.Date={{ .CommitDate }}
      # 默认升级渠道 = 构建仓库:产物自报「从哪查更新」,fork 发版自洽(未注入时后端回落硬编码)。
      - -X github.com/huangchengsir/pipewright/internal/version.DefaultRepo={{ .Env.RELEASE_REPO }}

  # 集群客户端。Windows:托盘 GUI + Windows 服务(lxn/walk 纯 Go 无 CGO;GUI 子系统不弹
  # 控制台;rsrc_windows_*.syso 按目标自动链接)。仅 Windows 用该 build。
  - id: pwclient
    main: ./cmd/pwclient
    binary: pwclient
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -H=windowsgui # GUI 子系统:双击不弹控制台窗口(文本子命令经 AttachConsole 接回终端)
      - -X github.com/huangchengsir/pipewright/internal/version.Version={{ .Version }}
      - -X github.com/huangchengsir/pipewright/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/huangchengsir/pipewright/internal/version.Date={{ .CommitDate }}
      # 与后端同款:升级检查/下载渠道跟随构建仓库,fork 发版自洽(未注入时回落硬编码)。
      - -X github.com/huangchengsir/pipewright/internal/version.DefaultRepo={{ .Env.RELEASE_REPO }}

  # 集群客户端 Linux/macOS 形态:前台进程 + 浏览器承载同一套 Web 界面,服务经 systemd
  # (Linux)/launchd(macOS)。不能带 -H=windowsgui(非 Windows 链接器不认);故单列 build。
  - id: pwclient-unix
    main: ./cmd/pwclient
    binary: pwclient
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/huangchengsir/pipewright/internal/version.Version={{ .Version }}
      - -X github.com/huangchengsir/pipewright/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/huangchengsir/pipewright/internal/version.Date={{ .CommitDate }}
      - -X github.com/huangchengsir/pipewright/internal/version.DefaultRepo={{ .Env.RELEASE_REPO }}

archives:
  - id: default
    builds: [pipewright]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SECURITY.md
  - id: pwclient
    builds: [pwclient, pwclient-unix]
    formats: [tar.gz]
    name_template: >-
      pwclient_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      # 随包分发 EasyTier 官方二进制(未修改,LGPL-3.0;运行时 Locate 会找 exe 同级 bin/)。
      # 许可证全文 + 来源说明 + 版本标记一并入包(LGPL-3.0 §4 义务)。按平台目录取对应二进制。
      - src: third_party/easytier/{{ .Os }}-{{ .Arch }}/bin/*
        dst: bin
      - src: third_party/easytier/licenses/*
        dst: licenses/easytier

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  groups:
    - title: 🚀 新功能
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: 🐛 修复
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: ⚡ 性能
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: 其它
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - Merge pull request
      - Merge branch

# 每架构单独构建单平台镜像(二进制在 context 根名为 pipewright,与 Dockerfile.goreleaser 匹配),
# 再由 docker_manifests 合并为多架构清单。注:dockers_v2 一次构建多平台时二进制不落 context 根,
# COPY 会失败,故用经典 dockers(弃用告警仅提示,功能稳定)。镜像命名空间经 env 注入(tag 推到
# 自己的仓库即推自己账号下的 ghcr)。
dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/{{ .Env.IMAGE_NAMESPACE }}/pipewright:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.RELEASE_REPO }}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - id: arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/{{ .Env.IMAGE_NAMESPACE }}/pipewright:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.RELEASE_REPO }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/{{ .Env.IMAGE_NAMESPACE }}/pipewright:{{ .Version }}"
    image_templates:
      - "ghcr.io/{{ .Env.IMAGE_NAMESPACE }}/pipewright:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.IMAGE_NAMESPACE }}/pipewright:{{ .Version }}-arm64"
  # latest 仅正式版推送(预发布 tag 自动跳过)。
  - name_template: "ghcr.io/{{ .Env.IMAGE_NAMESPACE }}/pipewright:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/{{ .Env.IMAGE_NAMESPACE }}/pipewright:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.IMAGE_NAMESPACE }}/pipewright:{{ .Version }}-arm64"

# Release 目标不写死 owner/name:由 git remote 推断 —— tag 推到哪个仓库,Release 就发到哪。
release:
  draft: false
  # 含 -rc/-beta 等预发布标识的 tag 自动标记为 prerelease。
  prerelease: auto
  name_template: "Pipewright {{ .Tag }}"
  footer: |
    ---
    ## 安装

    一行命令(Linux / macOS,自动下载本 Release 的平台二进制并安装):
    ```sh
    curl -fsSL https://raw.githubusercontent.com/{{ .Env.RELEASE_REPO }}/{{ .Tag }}/install.sh | sh
    ```

    直接装为 systemd 服务(开机自启 + 一键自更新;Linux,需 root):
    ```sh
    curl -fsSL https://raw.githubusercontent.com/{{ .Env.RELEASE_REPO }}/{{ .Tag }}/install.sh | SETUP_SERVICE=1 sh
    ```

    本地编译安装(Linux / macOS):
    ```sh
    git clone https://github.com/{{ .Env.RELEASE_REPO }} && cd pipewright
    make build
    sh install.sh
    ```

    Docker:
    ```sh
    docker run -d -p 8080:8080 -v pipewright-data:/data ghcr.io/{{ .Env.IMAGE_NAMESPACE }}/pipewright:{{ .Version }}
    ```
